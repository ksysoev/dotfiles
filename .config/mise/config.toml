# Global mise config: tools and the whole machine bootstrap.
#
# ~/.config/mise is a symlink to this directory (`mise bootstrap --from` creates it),
# so `mise use -g` and `mise upgrade` edit these tracked files. Exact tool versions
# are pinned in mise.lock.
#
#   mise bootstrap plan              # preview what would change
#   mise bootstrap                   # apply everything below
#   mise bootstrap status --missing  # drift check (exit 1 if anything is off)
#
# Paths in [dotfiles] must start with ~/ — relative sources resolve against the
# ~/.config/mise symlink and break.

[settings]
lockfile = true

[tools]
# Language runtimes
go = "latest"
node = "lts"
python = "3.11"
java = "temurin-17"
groovy = "4.0"
# Shell
starship = "latest"

[env]
# Binaries installed with `go install`
_.path = ["~/go/bin"]

# ---------------------------------------------------------------------------
# Packages (Homebrew formulae and casks, installed by mise without needing brew)
# Removing a line does not uninstall; use `mise bootstrap packages prune`.
# ---------------------------------------------------------------------------
[bootstrap.packages]
"brew:aws-sam-cli" = "latest"
"brew:fd" = "latest"
"brew:ffmpeg" = "latest"
"brew:gh" = "latest"
"brew:ghostscript" = "latest"
"brew:glow" = "latest"
"brew:gnu-sed" = "latest"
"brew:golangci-lint" = "latest"
"brew:helm" = "latest"
"brew:htop" = "latest"
"brew:hugo" = "latest"
"brew:imagemagick" = "latest"
"brew:img2pdf" = "latest"
"brew:lsd" = "latest"
"brew:mockery" = "latest"
"brew:neovim" = "latest"
"brew:pi-coding-agent" = "latest"
"brew:poppler" = "latest"
"brew:protobuf" = "latest"
"brew:redis" = "latest"
"brew:ripgrep" = "latest"
"brew:slides" = "latest"
"brew:staticcheck" = "latest"
"brew:stockfish" = "latest"
"brew:tmux" = "latest"
"brew:unzip" = "latest"
"brew:websocat" = "latest"
"brew:wget" = "latest"
# From taps
"brew:anomalyco/tap/opencode" = "latest"
"brew:hashicorp/tap/packer" = "latest"
"brew:ksysoev/authkeeper/authkeeper" = "latest"
"brew:ksysoev/make-it-public/make-it-public" = "latest"
"brew:ksysoev/wsget/wsget" = "latest"
# Apps
"brew-cask:copilot-cli" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:wezterm" = "latest"

# ---------------------------------------------------------------------------
# Git checkouts
# ---------------------------------------------------------------------------
[bootstrap.repos]
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", depth = 1 }
"~/.local/share/zsh/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git", depth = 1 }

# ---------------------------------------------------------------------------
# Dotfiles (symlinks into this repo). Conflicting real files are moved to
# <file>.bak.<timestamp> by the pre-dotfiles hook before linking.
# ---------------------------------------------------------------------------
[dotfiles]
"~/.zshrc" = { source = "~/Documents/Dev/dotfiles/.zshrc" }
"~/.gitignore_global" = { source = "~/Documents/Dev/dotfiles/.gitignore_global" }
"~/.config/nvim" = { source = "~/Documents/Dev/dotfiles/.config/nvim" }
"~/.config/starship.toml" = { source = "~/Documents/Dev/dotfiles/.config/starship.toml" }
# Login shells and GUI-launched apps: Homebrew on PATH (no brew CLI needed)
"~/.zprofile/homebrew" = { line = 'export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"' }

[bootstrap.mise_shell_activate]
zshrc = false      # .zshrc is tracked and activates mise itself
zprofile = "shims" # login shells and GUI-launched apps see mise tools

# ---------------------------------------------------------------------------
# Hooks and the final task (run on every `mise bootstrap`; keep them idempotent)
# ---------------------------------------------------------------------------
[bootstrap.hooks.pre-dotfiles]
description = "Back up real files that would block dotfile symlinks"
run = "~/Documents/Dev/dotfiles/bootstrap/backup-conflicts.sh"

[tasks.bootstrap]
description = "Final machine setup steps"
run = [
  "git config --global core.excludesfile ~/.gitignore_global",
  "nvim --headless '+Lazy! restore' +qa",
]
