# Repo-local mise config: tasks for bootstrapping and maintaining this machine.
# Machine-wide tools live in .config/mise/config.toml.

[tasks.link]
description = "Symlink dotfiles into $HOME (use --check to only report)"
run = "mise-tasks/link.sh"

[tasks.tools]
description = "Install tools from the global mise config"
run = "mise install"

[tasks.doctor]
description = "Detect drift between this repo and the machine"
run = [
  "mise-tasks/link.sh --check",
  "mise doctor",
]
